<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <h1>🍔 Foodie Hub</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Order</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Delicious Food Delivered To You</h2>
        <p>Order your favorite meals anytime</p>
        <button>Order Now</button>
    </section>

    <!-- Menu Section -->
    <section class="menu">
        <h2>Our Menu</h2>

        <div class="food-items">
            <div class="card">
                <h3>Pizza</h3>
                <p>Cheesy delight</p>
                <span>₹299</span>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <h3>Burger</h3>
                <p>Juicy & tasty</p>
                <span>₹149</span>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <h3>Pasta</h3>
                <p>Italian special</p>
                <span>₹199</span>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Order Form -->
    <section class="order">
        <h2>Place Your Order</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="text" placeholder="Address" required>
            <select>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Pasta</option>
            </select>
            <input type="number" placeholder="Quantity" required>
            <button type="submit">Submit Order</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Foodie Hub | All Rights Reserved</p>
    </footer>

</body>
</html>
